name: Build bun-web (arm64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version, e.g. 3.8.51 (builds release/v<version> branch)'
        required: true
        default: '3.8.51'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v${{ inputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bun-web (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bun
          target: runner-web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/bob-qoo/omniroute:${{ inputs.version }}-web-bun
          cache-from: type=gha
          cache-to: type=gha,mode=max
